<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Fondo animado -->
    <div id="stars"></div>

    <!-- Corazones -->
    <div class="hearts"></div>

    <!-- Pantalla principal -->
    <section class="hero">

        <div class="glass">

            <h2>Para la persona que cambió mi vida</h2>

            <h1>❤️ Mi Amor ❤️</h1>

            <p>

                Hay miles de páginas en Internet...

                pero esta solo existe para recordarte
                cuánto te amo.

            </p>

            <button id="start">
                Abrir nuestra historia
            </button>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
